# Start:  docker compose up -d --build   ->   http://127.0.0.1:8081
#
# app  Apache mit PHP und der Anwendung
# db   MariaDB; das Schema wird beim ersten Start automatisch eingelesen
#
# Die Zugangsdaten im Container stammen aus APP_DB_USER und APP_DB_PASSWORD,
# getrennt von DB_USER und DB_PASSWORD fuer den lokalen Betrieb ohne Docker.

name: secure-login

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: auth_system
      DB_USER: "${APP_DB_USER:-app}"
      DB_PASSWORD: "${APP_DB_PASSWORD:-app}"
      APP_URL: "${APP_URL:-http://127.0.0.1:8081}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: auth_system
      MARIADB_USER: "${APP_DB_USER:-app}"
      MARIADB_PASSWORD: "${APP_DB_PASSWORD:-app}"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
