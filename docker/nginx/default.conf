# =====================================================================
# Secure Login — Reverse Proxy
#
# Liefert die statischen Dateien aus und leitet PHP-Anfragen an den
# PHP-FPM-Dienst weiter. Der Dokument-Root zeigt auf public/ — damit
# bleiben Konfiguration und Anwendungscode vor dem Browser verborgen.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 2m;

    # --- Sicherheits-Header ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- Statische Dateien ---
    location /assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Verzeichnisse und versteckte Dateien ---
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- PHP ---
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 30;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 32k;
    }

    # --- Standard ---
    location / {
        try_files $uri /index.php$is_args$args;
    }
}
